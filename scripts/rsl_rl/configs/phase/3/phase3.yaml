train:
  project_name: unitree_go1_antalgic
  task: Template-Go1-Lab-v0
  agent: rsl_rl_phase3_cfg_entry_point

  num_envs: 2048
  max_iterations: 4000 # 8000, 500
  normalize: 
    enable: true
    
    obs:
      # mean: [0.01, 0.0, 0.01], std: [0.58, 0.35, 0.25], max: [10.72, 4.26, 2.75], min: [-10.56, -3.82, -2.86]
      angular_vel: 1.0

      # mean: [-0.43, -0.01, -1] std: [0.07, 0.07, 0.05], max: [0.59,	0.62, -0.65], min: [-0.43	-0.72	-1.24]
      gravity: 1.0

      # mean: [0.52, 0.00,	0.01] std: [0.27,	0.17,	0.23], max: [1.00, 0.30, 0.40], min: [0.00, -0.30, -0.40]
      cmd_vel: 1.0

      joint_pos: 1.0

      # mean: -0.05, 0.02, -0.02, 0.01, 0.22, 0.08, -0.11, -0.10, -0.43, -0.15, 0.30, 0.23
      # min: -17.29, -19.39, -19.16, -19.38, -22.18, -21.27, -13.81, -15.90, -20.10, -20.08, -20.09, -20.06
      # max: 18.20, 19.23, 24.47, 19.12, 16.00, 16.90, 17.11, 14.65, 20.10,20.09, 20.08, 20.10
      # std: 
      joint_vel: 0.23
      action: 1.0

    priv:
      splint_length: 1
      linear_vel: 1
  # 출력 정규화 상수. compute_output_norm.py 가 생성 — 손으로 고치지 말고 다시 생성할 것.
  #   source   : P2_at_dbg
  #   generated: 2026-09-13 14:26   rows 1,200,000   action tail 20%   noise model_7998.pt [log_std]
  #   z = (y - mean) / std.  mean 은 차원별, std 는 head 당 pooled 하나 = sqrt(mean_j Var_j)
  mse_norm:
    enable: true

    action_mean: [-0.867, 0.887, -0.972, 1.043, -0.996, -0.972, -0.548, -0.731, 2.245, 2.127, 1.629, 1.769]   # 관절 순서 hip FL FR RL RR, thigh FL FR RL RR, calf FL FR RL RR
    action_pstd: 0.7827                   # 12관절 pooled, 탐색 노이즈 분산 제거 (정상 0.594 / 부상 0.898)

    splint_mean: 0.3501                    # 부상 env 만 [m]
    splint_std: 0.0286

    vel_mean: [0.0009, -0.0034, 0.0097]          # 축 순서 x y z [m/s]
    vel_pstd: 0.4528                      # 3축 pooled (축별 [0.556, 0.543, 0.103])
  seed: 42

  num_steps_per_env: 50
  gradient_length: 50

  splint_loss_coef: 1.0
  vel_loss_coef: 1.0
  
checkpoint:
  mode: "distill" # warmstart, resume
  # Phase 2 teacher (부목 모델 v2)
  teacher: "/home/shw/go1_lod/scripts/rsl_rl/logs/unitree_go1_antalgic/P2_at_dbg/model_7998.pt"
  student: ""
  load_optimizer: false # false, true
  reset_iteration: true
  reset_noise_std: false    # warmstart 시 init_noise_std 로 std 를 되돌린다


env:
  path: ../../env/antalgic.yaml
 
eval:
  peg_leg: normal # normal, fl, fr, rl, rr

exploration:
  noise_std:
    # 실제 사용할 탐색 노이즈 방식
    set: log  # scalar 또는 log

    types:
      scalar:
        init_noise_std: 1.0
        min_action_std: 0.001

      log:
        init_noise_std: 0.05
        min_action_std: 0.001