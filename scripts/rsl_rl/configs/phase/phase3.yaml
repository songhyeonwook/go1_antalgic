train:
  project_name: unitree_go1_antalgic
  task: Template-Go1-Lab-v0
  agent: rsl_rl_phase3_cfg_entry_point

  num_envs: 2048
  max_iterations: 4000 # 8000, 500
  seed: 42

checkpoint:
  mode: "distill" # warmstart, resume
  # Phase 2 teacher (부목 모델 v2)
  teacher: /home/shw/go1_lod/scripts/rsl_rl/logs/unitree_go1_antalgic/2026_08_13_20_39_04_phase2_s42_P2-splint-003-liverls/model_10998.pt
  student: ""
  load_optimizer: false # false, true
  reset_iteration: true
  
env:
  path: ../env/antalgic.yaml
  overrides:
    peg_leg:
      curriculum:
        enabled: false

eval:
  peg_leg: normal # normal, fl, fr, rl, rr

exploration:
  noise_std:
    # 실제 사용할 탐색 노이즈 방식
    set: log  # scalar 또는 log

    types:
      scalar:
        init_noise_std: 1.0
        min_action_std: 0.001
        enforce_min_std: true

      log:
        init_noise_std: 0.05
        min_action_std: 0.001
        enforce_min_std: true