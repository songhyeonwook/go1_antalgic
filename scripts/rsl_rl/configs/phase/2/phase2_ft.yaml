# Fault-tolerant 대조군 (pain ablation).
#
#   PYTHONPATH=/home/shw/go1_lod/source/go1_lab python3 train.py --phase 2 \
#       --phase_config_path configs/phase/phase2_ft.yaml \
#       --run_tag P2-fault-tolerant-001 --headless

train:
  project_name: unitree_go1_antalgic
  task: Template-Go1-Lab-v0
  agent: rsl_rl_phase2_cfg_entry_point

  num_envs: 2048
  max_iterations: 6000
  seed: 42
  num_steps_per_env: 24

checkpoint:
  mode: "warmstart"
  teacher: ""
  student: ""
  load_optimizer: false
  reset_iteration: false
  reset_noise_std: true    # warmstart 시 init_noise_std 로 std 를 되돌린다

env:
  path: ../../env/antalgic.yaml
  overrides:
    name: fault_tolerant
    reward:
      injury:
        enabled: false   # pain 비활성

eval:
  peg_leg: normal

exploration:
  noise_std:
    set: log
    types:
      scalar:
        init_noise_std: 1.0
        min_action_std: 0.001
      log:
        init_noise_std: 0.3
        min_action_std: 0.001
