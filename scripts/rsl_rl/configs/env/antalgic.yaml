name: antalgic # fault_tolerant, joint_symmetric, antalgic
use_peg_leg_action_mask: true

peg_leg:
  enabled: true
  grace_steps: 30

  # 부목 부착 링크: thigh(무릎 고정 다리보조기, 전후 스윙 가능) | hip(강체 지팡이)
  attach: thigh
  # 부상 무릎을 접어 발을 들어올리는 각도 [rad]
  fold_knee_angle: -2.55

  prob_peg_leg: 0.5 # 부상을 적용할 확률
  # target_leg 가 env fixed인 경우 prob_peg_leg를 적용하지 않음
  # 부상이 적용되었다면 환경번호에 따라 정상, 부상 다리를 역할을 고정적으로 결정함
  # (env_fixed 는 부목 presence 토글이 첫 리셋 이후 발생하지 않아 학습 비용도 0)
  target_leg: 'env_fixed'
  env_fixed_healthy_slots: 4 # 정상다리 갯수

  # 부상이 선택됐을 때 적용할 설정
  prob_joint_disabled: 1.0 # 부상 다리가 선택됐을 때 해당 다리의 calf 관절을 실제로 고정할 확률

  # true: 부상 다리의 부목 끝단 shape에만 샘플 마찰 적용
  # false: 부상 환경의 로봇 전체 shape에 적용 (비권장)
  injured_splint_friction_only: true

  # curriculum이 꺼져있는 경우 아래 범위로 사용.
  # ⚠️ 부목 모델 v2: L 은 골반 부착점→끝단 길이. nominal leg reach ≈ 0.31 m 이므로
  #    0.33 미만은 접지 불가, USD 설계 상한(SPLINT_MAX)은 0.48.
  splint_length_range: [0.33, 0.45] # 부목 길이 균등분포 파라미터
  foot_friction_range: [0.5, 1.5] # 부목 끝단에 사용할 마찰계수 샘플 범위

  # 부상 다리 hip 토크 제한
  hip_torque:
    scale: 1.0 # 부상 다리에서 선택된 관절의 최대 허용 토크를 정상 대비 몇 배로 할지
    weaken_joints: hip # 부상 다리에서 어떤 관절의 토크를 약화시킬지 "hip", "thigh", "hip,thigh", "thigh,hip"

  # 잠긴 calf 전용 PD 설정 (compliant 부목 무릎 — 충격 흡수)
  splint_actuator:
    stiffness: 100.0
    damping: 1.0

  curriculum:
    enabled: true

    # 부상 다리 확률
    leg_probability:
      initial: 0.1
      final: 0.5
      iterations: 4500 # 증가 함수

    # 부목 길이 범위 램프: 짧은 부목(≈nominal leg reach, 쉬움)에서 시작해
    # 긴 부목(키다리, 비대칭 큼)까지 확장
    splint_length:
      # 초기 부목범위 (쉬움)
      initial_min: 0.33
      initial_max: 0.36

      # 후기학습시 부목 범위 (전체)
      final_min: 0.33
      final_max: 0.45

      iterations: 6000
    
# 로봇 Actuator 설정 OK
actuator:
  type: pd

  pd:
    kp: 20.0                        # 관절 목표 위치 추종 강도
    kd: 0.5                         # 관절 진동 및 급격한 움직임 감쇠
    effort_limit: 23.7              # 최대 관절 토크 [N·m]
    velocity_limit: 30.0            # 최대 관절 속도 [rad/s]
    friction: 0.0                   # actuator 내부 마찰

# 시뮬레이션 및 지형
simulation:
  # PhysX 환경 복제 설정
  replicate_physics: false        # ContactSensor 초기화 문제 방지
  clone_in_fabric: false          # 물리 복제 최적화 비활성화

  # GPU PhysX 접촉 버퍼
  gpu:
    gpu_total_aggregate_pairs_capacity: 8388608   # 2^23, 대규모 병렬 환경 접촉 버퍼
    gpu_found_lost_pairs_capacity: 8388608        # 2^23

  # 지형 형상
  terrain:
    flat: true                      # true이면 plane, false이면 rough terrain

    curriculum:
      terrain_levels: null

  contact_compliance:
    enabled: false                # 접촉을 부드럽게 만들지 여부
    stiffness: 0.0                # 0이면 비활성화
    damping: 2000.0

# 속도 명령 범위
command:
  linear_velocity_x:
    min: 0.10                     # 전진 최소 속도 [m/s]
    max: 1.00                     # 전진 최대 속도 [m/s]

  linear_velocity_y_abs: 0.3      # 좌우 속도 범위 [-값, +값]
  angular_velocity_yaw_abs: 0.4  # 회전 속도 범위 [-값, +값]


# Observation 설정
observation:
  history_length: 1              # 현재 observation만 사용
  use_height_scan: false         # proprioception_only였는데 이름 변경 자기 상태 정보만 사용

  use_calf_pos_nominal_rel: true

  # RLS 부목 길이 추정 채널 [L̂_norm, √P_norm] 을 policy 관측에 추가
  # (추정기 모듈이 붙기 전까지는 prior 상수 — 차원 예약용)
  use_rls_estimate: true

  # Phase 1에서도 Phase 2와 입력 차원을 맞추기 위해
  # privileged observation group 자체는 유지
  # (base_lin_vel 은 실기에 없는 신호라 policy 그룹에서 privileged 로 이동됨)
  privileged:
    enabled: true

# Domain Randomization OK
domain_randomization:
  enabled: true                   # Sim-to-Real 강건성을 위한 DR 사용 여부

  # 바닥과 발 사이의 미끄러움 변경 OK
  ground_friction:
    enabled: true
    static_range: [0.5, 1.5]      # 정지 마찰계수 범위 발이 바닥에서 아직 미끄러지지 않고 버티고 있을 때의 마찰
    dynamic_range: [0.4, 1.2]     # 운동 마찰계수 범위
 
  # 로봇의 몸통 질량을 환경마다 무작위로 변경 OK , payload
  robot_mass:
    enabled: true
    body_name: "trunk"
    scale_range: [0.85, 1.15]     # nominal 질량의 85~115%

  # 로봇 몸통에 외란을 가하는 설정 OK
  random_push:
    enabled: true
    interval_range_s: [8.0, 12.0] # 미는시간
    velocity_x_range: [-0.5, 0.5] # x
    velocity_y_range: [-0.5, 0.5] # y

  observation_noise:
    enabled: true
    joint_pos_std: 0.02
    joint_vel_std: 0.02
    base_ang_vel_std: 0.05
    projected_gravity_std: 0.05
    base_lin_vel_std: 0.05

# 전방 Payload 및 CoM 설정 OK
payload:
  enabled: false
  front_payload_kg: 0.0           # trunk에 추가할 질량 [kg]
  front_com_x_m: 0.0              # CoM 전방 이동량 [m]
  front_com_z_m: 0.0              # CoM 수직 이동량 [m]

reward:
  task: # 로봇이 명령을 제대로 수행
    enabled: true
    track_linear_velocity_weight: 3.0 # 전후, 좌우 속도를 얼마나 잘 따라가는지 보상 # 6->3
    track_angular_velocity_weight: 0.75 # 명령받은 회전속도를 얼마나 잘 따라가는지 보상
    linear_velocity_z_weight: -2.0 # 몸이 위 아래로 빠르게 흔들리면 주는 패널티
  
  gait_tuning: # 보행 모양과 부드러움을 조정
    enabled: true
    # GO1_FEET_AIR_TIME_WEIGHT
    feet_air_time_weight: 0.3 # 발이 지면에서 떨어져 공중에 머무르는 시간을 보상 # 0.25 -> 0.5

    # 적용 전 값. 이후 action_rate_penalty_scale=0.5가 곱해져 실제 최종 weight는 -0.025가 됨
    action_rate_weight: -0.1 # 연속된 두 시점의 action 변화량을 벌점
    angular_velocity_xy_weight: -0.1 # 몸통의 roll축과 pitch축 각속도를 억제하기 위한 벌점

  energy:
    # 이미 Isaac Lab에 존재하는 페널티의 가중치를 배율로 조정
    # ex # Isaac Lab 기본 -0.0002 × 30 = 실제 최종 -0.006
    torque_penalty_scale: 20 # 관절 토크가 클수록 페널티가 커짐

    # Isaac Lab 기본 -2.5e-7 × 0.5 = 실제 최종 -1.25e-7
    dof_acc_penalty_scale: 0.5 # 관절 가속도 페널티

    # gait_tuning의 -0.05 × 0.5 = 실제 최종 -0.025
    action_rate_penalty_scale: 0.5 # final action rate weight = action_rate_weight *action_rate_penalty_scale 

  posture:
    flat_orientation_weight: -2.0 # 몸통이 수평에서 벗어나는 것을 벌점
    base_height_target: 0.27 # 로봇 몸통이 유지해야 할 목표 높이 (목표값임 보상아님)
    base_height_weight: -0.15 # 실제 몸통 높이가 목표 높이에서 벗어나는 것을 벌점
  
  # 정상 calf가 바닥을 짚는 무릎/정강이 보행 방지
  calf_contact:
    enabled: false

    # 함수 출력이 접촉력 N 단위이므로 작은 값부터 시작
    weight: -0.01

    # 이 힘 이하의 calf 접촉은 무시
    force_threshold: 5.0

    # calf 하나당 raw penalty 상한
    max_overload: 100.0

    # true: 수직 힘만 사용
    # false: 수직·수평을 포함한 전체 접촉력 사용
    use_z_only: true

  # alive bonus
  survival_bonus:
    enabled: true
    weight: 1.0 # 로봇이 종료되지 않고 한 step을 버틸 때마다 주는 생존 보상
  

  joint_mirror_symmetry:
    enabled: False
    weight: -2.0

  # 정상 상태에서의 대칭 리워드
  symmetric: # 네 다리를 균형 있게 사용하도록 유도하는 보상 모음
    enabled: false

    contact_force_asymmetry: # 패널티에 해당함으로
      weight: -0.012 # 음수로 줘야함
      ramp_duration_steps: 6000

    duty_factor_asymmetry:
      weight: -0.04
      contact_threshold: 1.0
      ramp_duration_steps: 6000

    diagonal_load_asymmetry:
      weight: -0.006
      ramp_duration_steps: 6000

    front_rear_load_distribution:
      weight: -0.0025
      target_front_fraction: 0.55
      tolerance: 0.06
      ramp_duration_steps: 6000

    trot_synchronization:
      weight: 0.12
      ramp_duration_steps: 6000
  
  # 부상 리워드
  injury:
    enabled: true 
    
    penalty_pain:             # 부상 다리에 접촉력·과부하가 생길 때 통증 페널티
      enabled: True
      weight: -0.02

      # 통증 함수
      failure_force_threshold: 16.0 # 통증이 시작되는 기준
      pain_scale: 0.4 # 통증이 얼마나 빠르게 증가하는지 결정하는 계수
      max_exp_argument: 10.0 # pain form의 x상한
      max_penalty: 200.0 # pain form y상한
      
      # 접촉 자체에 대한 기본 비용
      base_contact_cost: 0.05 #접촉에 대한 기본 비용
      contact_detect_threshold: 1.0 # 지면 접촉으로 판단할 최소 힘

      # calf 접촉력까지 포함
      include_calf: true

    # 부목 다리를 쓰지 않으면 주는 벌점: 부상 다리를 완전히 들고 걷는 3족 보행 억제
    # (부목 모델 v2: 하중은 부목 끝단 접촉력으로 측정)
    injured_limb_force_nonuse:
      enabled: true
      weight: -1.0

      # true 면 발+calf 접촉력도 하중에 합산 (구모델 호환).
      # v2 에서 발/calf 접촉은 통증(penalty_pain) 대상이므로 false 권장.
      include_calf: false

      min_force_severe: 5.0
      min_force_mild: 5.0

      # 앞다리는 구조적으로 조금 더 높은 최소 하중 적용
      front_leg_multiplier: 1.15
      rear_leg_multiplier: 1.0

      # 평균 접촉력 계산
      ema_alpha: 0.97

      # reward 점진적 활성화
      ramp_start_steps: 1000
      ramp_duration_steps: 40000

    injured_limb_load_duty_nonuse:  # 부상 다리의 유효 하중 시간이 너무 낮은 경우
      enabled: true
      weight: -1.5
      # 부목 끝단 힘 > 10 N인 유효 하중 시간이 목표 duty 미만이면 벌점
      # (severe/mild 기준 길이는 peg_leg.splint_length_range 에서 자동 유도)
      load_contact_threshold: 10.0
      min_duty_severe: 0.28
      min_duty_mild: 0.4
      front_leg_multiplier: 1.1
      rear_leg_multiplier: 1.0
      ema_alpha: 0.97
      ramp_duration_steps: 40000

# 종료 조건
termination:
  root_too_low:
    enabled: true
    minimum_height: 0.15

  bad_orientation:
    enabled: true
    limit_angle: 0.8
